<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - La Casa del Movimiento</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">Casa del Movimiento</div>
            
            <div class="sidebar-user">
                <strong id="userName">Cargando...</strong>
                <span class="role-badge">Tallerista</span>
            </div>

            <nav class="sidebar-nav">
                <li><a href="#perfil" class="nav-link active">Mi Perfil</a></li>
                <li><a href="#interesados" class="nav-link">Interesados</a></li>
                <li><a href="#mis-noticias" class="nav-link">Mis Noticias</a></li>
                <li><a href="#crear-noticia" class="nav-link">Crear Noticia</a></li>
                <li><button class="logout-btn" onclick="logout()">Cerrar Sesión</button></li>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="header">
                <h1>Mi Panel de Tallerista</h1>
            </div>

            <!-- SECCIÓN: MI PERFIL -->
            <section id="perfil" class="section">
                <div class="card">
                    <h2 class="card-title">Mi Perfil</h2>
                    
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="profileName" readonly>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="profileEmail" readonly>
                    </div>

                    <div class="form-group">
                        <label>Biografía</label>
                        <textarea id="profileBio" placeholder="Cuéntanos sobre ti..."></textarea>
                    </div>

                    <button class="btn btn-primary" onclick="updateProfile()">Guardar Cambios</button>
                </div>
            </section>

            <!-- SECCIÓN: INTERESADOS -->
            <section id="interesados" class="section" style="display: none;">
                <div class="card">
                    <h2 class="card-title">Personas Interesadas en mi Taller</h2>
                    
                    <div id="interesadosList">
                        <p>Cargando...</p>
                    </div>
                </div>
            </section>

            <!-- SECCIÓN: MIS NOTICIAS -->
            <section id="mis-noticias" class="section" style="display: none;">
                <div class="card">
                    <h2 class="card-title">Mis Noticias</h2>
                    
                    <div id="noticiasGrid" class="card-grid">
                        <p>Cargando...</p>
                    </div>
                </div>
            </section>

            <!-- SECCIÓN: CREAR NOTICIA -->
            <section id="crear-noticia" class="section" style="display: none;">
                <div class="card">
                    <h2 class="card-title">Crear Nueva Noticia</h2>
                    
                    <form id="crearNoticiaForm" class="form">
                        <div class="form-group">
                            <label>Título</label>
                            <input type="text" id="noticiaTitle" placeholder="Título de la noticia" required>
                        </div>

                        <div class="form-group">
                            <label>Resumen (preview)</label>
                            <textarea id="noticiaResumen" placeholder="Breve resumen..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Contenido</label>
                            <textarea id="noticiaCuerpo" placeholder="Contenido completo..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Categoría</label>
                            <select id="noticiaCategoria" required>
                                <option value="">Selecciona una categoría</option>
                                <option value="reflexiones">Reflexiones</option>
                                <option value="cronicas-eventos">Crónicas de Eventos</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="noticiaDedicada">
                                Marcar como destacada (aparecerá en grande)
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary">Publicar Noticia</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        // Proteger ruta (solo talleristas)
        const session = protectRoute('tallerista');

        if (session) {
            // Cargar datos iniciales
            document.getElementById('userName').textContent = session.userName;
            loadProfileData(session.userId);
            loadInteresados(session.userId);
            loadMyNoticias(session.userId);

            // Navegar entre secciones
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const sectionId = link.getAttribute('href').substring(1);
                    showSection(sectionId);
                    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                });
            });

            // Crear noticia
            document.getElementById('crearNoticiaForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await createNoticia(session.userId);
            });
        }

        async function loadProfileData(userId) {
            try {
                const { data, error } = await supabase
                    .from('autores')
                    .select('nombre, email, biografia')
                    .eq('id', userId)
                    .single();

                if (error) throw error;

                document.getElementById('profileName').value = data.nombre;
                document.getElementById('profileEmail').value = data.email;
                document.getElementById('profileBio').value = data.biografia || '';
            } catch (error) {
                console.error('Error cargando perfil:', error);
            }
        }

        async function updateProfile() {
            const userId = localStorage.getItem('userId');
            const bio = document.getElementById('profileBio').value;

            try {
                const { error } = await supabase
                    .from('autores')
                    .update({ biografia: bio })
                    .eq('id', userId);

                if (error) throw error;
                alert('✅ Perfil actualizado correctamente');
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error al actualizar perfil');
            }
        }

        async function loadInteresados(userId) {
            try {
                // Obtener el ID del taller del tallerista
                const { data: tallerData, error: tallerError } = await supabase
                    .from('talleres')
                    .select('id')
                    .eq('instructor_id', userId)
                    .single();

                if (tallerError || !tallerData) {
                    document.getElementById('interesadosList').innerHTML = 
                        '<p>No tienes talleres registrados</p>';
                    return;
                }

                // Obtener interesados
                const { data, error } = await supabase
                    .from('interesados_talleres')
                    .select('*')
                    .eq('taller_id', tallerData.id)
                    .order('fecha_registro', { ascending: false });

                if (error) throw error;

                if (data.length === 0) {
                    document.getElementById('interesadosList').innerHTML = 
                        '<p>Aún no hay personas interesadas</p>';
                    return;
                }

                const html = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(i => `
                                <tr>
                                    <td>${i.nombre}</td>
                                    <td>${i.email}</td>
                                    <td>${i.telefono || 'N/A'}</td>
                                    <td>${new Date(i.fecha_registro).toLocaleDateString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                document.getElementById('interesadosList').innerHTML = html;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('interesadosList').innerHTML = 
                    '<p>Error al cargar interesados</p>';
            }
        }

        async function loadMyNoticias(userId) {
            try {
                const { data, error } = await supabase
                    .from('noticias')
                    .select('id, titulo, resumen, fecha_publicacion, publicado')
                    .eq('autor_id', userId)
                    .order('fecha_publicacion', { ascending: false });

                if (error) throw error;

                if (data.length === 0) {
                    document.getElementById('noticiasGrid').innerHTML = 
                        '<p>Aún no tienes noticias publicadas</p>';
                    return;
                }

                const html = data.map(noticia => `
                    <div class="card">
                        <h3>${noticia.titulo}</h3>
                        <p>${noticia.resumen}</p>
                        <p style="font-size: 0.85rem; color: #999;">
                            ${new Date(noticia.fecha_publicacion).toLocaleDateString()}
                            ${noticia.publicado ? '✅ Publicada' : '❌ Borrador'}
                        </p>
                    </div>
                `).join('');

                document.getElementById('noticiasGrid').innerHTML = html;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function createNoticia(userId) {
            const titulo = document.getElementById('noticiaTitle').value;
            const resumen = document.getElementById('noticiaResumen').value;
            const cuerpo = document.getElementById('noticiaCuerpo').value;
            const categorySlug = document.getElementById('noticiaCategoria').value;
            const destacada = document.getElementById('noticiaDedicada').checked;

            try {
                // Obtener ID de la categoría
                const { data: catData } = await supabase
                    .from('categorias')
                    .select('id')
                    .eq('slug', categorySlug)
                    .single();

                // Crear noticia
                const { error } = await supabase
                    .from('noticias')
                    .insert({
                        titulo,
                        resumen,
                        cuerpo,
                        autor_id: userId,
                        categoria_id: catData.id,
                        publicado: true,
                        destacada
                    });

                if (error) throw error;

                alert('✅ Noticia creada exitosamente');
                document.getElementById('crearNoticiaForm').reset();
                loadMyNoticias(userId);
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error al crear noticia');
            }
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }
        async function logout() {
    try {
        // 1. Destruir la sesión activa en Supabase Auth
        if (dbClient && dbClient.auth) {
            await dbClient.auth.signOut();
        }
    } catch (error) {
        console.error('Error al cerrar sesión en Supabase:', error.message);
    } finally {
        // 2. Limpiar persistencia local
        localStorage.clear();
        sessionStorage.clear();

        // 3. Redireccionar a la raíz
        window.location.href = '../../index.html';
    }
}
    </script>
</body>
</html>

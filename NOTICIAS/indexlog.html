<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Casa del Movimiento - Login</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" type="image/png" href="https://ilmkmivwhfjlvznrsgoc.supabase.co/storage/v1/object/public/IMAGENES/logo.ico">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h1 class="brand">La Casa del Movimiento</h1>
            <p class="subtitle">Sistema de Gestión de Talleres</p>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="tu@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="loadingMessage" class="loading-message" style="display: none;">
                    Iniciando sesión...
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Iniciar Sesión
                </button>
            </form>

            <p class="login-footer">
                Sistema exclusivo para talleristas y administrativos
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="filesjs/js-login/supabase-config.js"></script>
    <script src="filesjs/js-login/auth.js"></script>
</body>
</html>

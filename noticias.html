<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Casa del Movimiento | Noticias</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="icon" type="image/png" href="https://ilmkmivwhfjlvznrsgoc.supabase.co/storage/v1/object/public/IMAGENES/logo.ico">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HEADER / NAVBAR -->
    <header>
        <a href="#" class="brand-logo" >
            <img src="https://ilmkmivwhfjlvznrsgoc.supabase.co/storage/v1/object/public/IMAGENES/logo-icon.webp" alt="logo" class="ico-imagen">
            <span>La Casa del Movimiento</span>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="talleres.html">Talleres</a></li>
                <li><a href="eventos.html">Eventos</a></li>
                <li><a href="#noticias" class="nav-item-active">Noticias</a></li>
                <LI><a href="NOTICIAS/indexlog.html"><img src="https://ilmkmivwhfjlvznrsgoc.supabase.co/storage/v1/object/public/IMAGENES/inicio%20secion.png" alt="inicio secion" class="log-icono"></a></LI>
            </ul>
        </nav>
    </header>

    <!-- SECCIÓN DE NOTICIAS -->
    <section class="news-section" id="noticias">
        <div class="section-padding">
            <h2 class="section-title">Noticias</h2>
            <p class="news-subtitle">Artículos, reflexiones y crónicas de la comunidad</p>

            <!-- TABS INTERACTIVOS -->
            <div class="news-tabs">
                <button class="tab-button tab-active" data-filter="todos">Todos</button>
                <button class="tab-button" data-filter="reflexiones">Reflexiones</button>
                <button class="tab-button" data-filter="cronicas">Crónicas de Eventos</button>
            </div>

            <!-- GRID ASIMÉTRICO DINÁMICO (Se llena con JS) -->
            <div class="news-grid">

                <!-- LADO IZQUIERDO (2/3): TARJETA DESTACADA -->
                <div class="news-featured">
                    <p>Cargando noticia principal...</p>
                </div>

                <!-- LADO DERECHO (1/3): TARJETAS SECUNDARIAS APILADAS -->
                <div class="news-sidebar-grid">
                    <p>Cargando noticias...</p>
                </div>

            </div>
        </div>
    </section>

    <!-- MODAL DE DETALLE DE NOTICIA -->
    <div id="newsDetailModal" class="news-modal">
        <div class="news-modal-overlay"></div>
        <div class="news-modal-container">
            <button class="news-modal-close" id="closeNewsModal">&times;</button>
            <div id="modalNewsBody" class="news-modal-body">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </div>
    </div>


    <!-- 1. Cargar Supabase CDN y tu Configuración (OBLIGATORIO) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="NOTICIAS/filesjs/js-login/supabase-config.js"></script>

    <!-- 2. Tu script de lógica pública -->
    <script src="js/scritps.js"></script>
</body>
</html>
